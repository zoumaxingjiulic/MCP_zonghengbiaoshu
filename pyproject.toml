[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "zongheng-qualification-mcp"
version = "0.1.0"
description = "Read-only MCP tools for Zongheng qualification data"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.2.0",
  "pydantic==2.13.5",
  "python-dotenv==1.2.3",
  "sqlalchemy==2.0.30",
  "pymysql==1.1.1",
  "uvicorn==0.52.4",
]

[project.scripts]
zongheng-mcp = "zongheng_mcp.server:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zongheng_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

